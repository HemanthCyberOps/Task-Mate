<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Mate</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <script src="../js/script.js" defer></script>
</head>
<body>
    <h1 id="task-mate">Task Mate</h1>
    <!---Login and SignUp Page-->
    <div id="auth-container">
        <!---Login Page-->
        <div id="login-form" class="form-box">
            <h2>Login</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" name="email" id="login-email" placeholder="Enter your Email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter you Password" required>
                </div>
                <div class="form-group">
                    <label for="login-submit"></label>
                        <input type="submit" id="login-submit" value="Submit">
                </div>
            </form>
            <p class="toggle-text">Don't have an account? <span id="show-signup">Sign Up</span></p>
        </div>
         <!-- Signup Form -->
          <div id="signup-form" class="form-box" style="display:none;">
            <h2>Sign Up</h2>
            <form action="/signup" method="post">
                <div class="form-group">
                    <label for="signup-firstname">Firstname:</label>
                    <input type="text" id="signup-firstname" name="firstname" placeholder="Enter firstname" required>
                </div>
                <div class="form-group">
                    <label for="signup-lastname">Lastname:</label>
                    <input type="text" id="signup-lastname" name="lastname" placeholder="Enter lastname" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email:</label>
                    <input type="email" id="signup-email" name="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password:</label>
                    <input type="password" id="signup-password" name="password" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password:</label>
                    <input type="password" id="signup-confirm-password" name="confirm-password" placeholder="Confirm password" required>
                </div>
                <div class="form-group">
                    <input type="submit" value="Sign Up" id="sign-up-submit">
                </div>
            </form>
            <p class="toggle-text">Already have an account? <span id="show-login">Login</span></p>
        </div>
    </div>
</body>
</html>
