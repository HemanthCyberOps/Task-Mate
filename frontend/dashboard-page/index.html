<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task Mate Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Profile Section -->
    <header class="site-header">
      <h1 id="home-page">Task Mate Dashboard</h1>

      <!-- PROFILE CONTAINER -->
      <div id="profile-container">
        <div id="profile-wrapper">
          <img
            id="profile-icon"
            src="default-profile.png"
            alt="Profile"
            role="button"
            aria-expanded="false"
            tabindex="0"
          />
          <!-- Edit overlay -->
          <div id="profile-edit-overlay" title="Change Profile Picture">✎</div>
          <input
            type="file"
            id="profile-upload"
            accept="image/*"
            style="display: none"
          />
        </div>

        <!-- Dropdown -->
        <div
          id="profile-dropdown"
          class="hidden"
          role="menu"
          aria-label="Profile menu"
        >
          <p id="profile-username">Hello, User!</p>
          <button id="logout-button" type="button">Log Out</button>
        </div>
      </div>
    </header>

    <!-- Add New Task -->
    <section id="add-task-section">
      <h2>Add New Task</h2>
      <form id="add-task-form">
        <input type="text" id="task-title" placeholder="Task Title" required />
        <input
          type="text"
          id="task-description"
          placeholder="Description (Optional)"
        />

        <div class="task-datetime-wrapper">
          <label for="task-date">Due Date</label>
          <input
            type="text"
            id="task-date"
            placeholder="Select date"
            readonly
            value=""
          />
          <div id="date-picker" class="custom-picker hidden"></div>
        </div>

        <div class="task-datetime-wrapper">
          <label for="task-time">Due Time</label>
          <input
            type="text"
            id="task-time"
            placeholder="Select time"
            readonly
            value=""
          />
          <div id="time-picker" class="custom-picker hidden">
            <input type="range" id="time-hour" min="0" max="23" value="12" />
            <input type="range" id="time-minute" min="0" max="59" value="30" />
            <div id="time-display">12:30</div>
            <button id="time-set" type="button">Set Time</button>
          </div>
        </div>

        <div class="custom-dropdown" id="task-priority-dropdown">
          <div class="dropdown-selected" tabindex="0">Select Priority</div>
          <div class="dropdown-options hidden">
            <div class="dropdown-option" data-value="low">Low</div>
            <div class="dropdown-option" data-value="medium">Medium</div>
            <div class="dropdown-option" data-value="high">High</div>
          </div>
        </div>

        <div class="custom-dropdown" id="task-status-dropdown">
          <div class="dropdown-selected" tabindex="0">Select Status</div>
          <div class="dropdown-options hidden">
            <div class="dropdown-option" data-value="todo">To Do</div>
            <div class="dropdown-option" data-value="in-progress">
              In Progress
            </div>
            <div class="dropdown-option" data-value="done">Done</div>
          </div>
        </div>

        <button type="submit">Add Task</button>
      </form>
    </section>

    <!-- List All Tasks -->
    <section id="your-task-section">
      <h2>Your Tasks</h2>
      <ul id="tasks"></ul>
    </section>
  </body>
</html>
